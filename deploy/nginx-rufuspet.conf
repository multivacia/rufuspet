# Site do Rufus. Gerado por deploy/instalar.sh a partir deste modelo.
# O certbot acrescenta o bloco HTTPS (porta 443) e o redirecionamento.
server {
    listen 80;
    server_name __SERVER_NAMES__;

    root __APP_DIR__/web/dist;
    index index.html;
    client_max_body_size 1m;
__AUTH__

    # API (Node, só acessível pelo próprio servidor)
    location /api/ {
        proxy_pass http://127.0.0.1:__PORTA__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos do build com hash no nome: cache longo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: rotas do React caem no index.html (sem cache, para pegar versões novas)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
